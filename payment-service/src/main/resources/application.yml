server:
  port: 8082

spring:
  application:
    name: payment-service
  datasource:
    url: jdbc:postgresql://localhost:5433/payments
    username: payments
    password: payments
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      acks: all
      properties:
        enable.idempotence: true
        linger.ms: 5
    consumer:
      group-id: payment-service
      auto-offset-reset: earliest
    listener:
      concurrency: 3

outbox:
  relay:
    enabled: true
    batch-size: 100
    poll-interval-ms: 500

payment:
  fake-gateway:
    max-amount: 10000.00

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
